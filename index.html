<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyCast, a simple weather app</title>
  <meta name="description" content="Search any city or use your location to see the weather now, the next 24 hours and the next 7 days.">
  <link rel="canonical" href="https://zakyprojects.github.io/weather/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Zakria Khan">
  <meta property="og:title" content="SkyCast, a simple weather app">
  <meta property="og:description" content="Search any city or use your location to see the weather now, the next 24 hours and the next 7 days.">
  <meta property="og:url" content="https://zakyprojects.github.io/weather/">
  <meta name="twitter:card" content="summary">
  <script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebApplication", "name": "SkyCast", "url": "https://zakyprojects.github.io/weather/", "description": "Search any city or use your location to see the weather now, the next 24 hours and the next 7 days.", "applicationCategory": "WeatherApplication", "operatingSystem": "Any", "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}, "author": {"@type": "Person", "name": "Zakria Khan", "url": "https://zakyprojects.github.io/"}}</script>
  <meta name="theme-color" content="#f7f7f5">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script>
    // Before first paint: the saved choice wins, otherwise follow the device/browser theme.
    try {
      var t = localStorage.getItem('skycast_theme');
      if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      if (t === 'dark') document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <a class="brand" href="./">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="4.5" fill="#f2b632"/><path d="M8 20h9.5a4 4 0 0 0 .4-8 6 6 0 0 0-11.4 1.6A3.3 3.3 0 0 0 8 20z" fill="currentColor"/></svg>
        SkyCast
      </a>
      <div class="top-actions">
        <div class="seg" role="group" aria-label="Temperature unit">
          <button type="button" data-unit="c" aria-pressed="true">°C</button>
          <button type="button" data-unit="f" aria-pressed="false">°F</button>
        </div>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch dark or light theme">
          <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <form id="search" class="search" role="search">
      <label class="sr-only" for="city">City</label>
      <input id="city" type="search" placeholder="Search a city, e.g. Peshawar" autocomplete="off" required>
      <button class="btn btn-dark" type="submit">Search</button>
      <button class="btn" id="locate" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
        My location
      </button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="empty" class="empty">
      <h1>What's the weather like?</h1>
      <p>Search a city or use your location. Try one of these:</p>
      <div class="chips">
        <button type="button" data-city="Peshawar">Peshawar</button>
        <button type="button" data-city="Lahore">Lahore</button>
        <button type="button" data-city="Karachi">Karachi</button>
        <button type="button" data-city="London">London</button>
      </div>
    </section>

    <div id="result" hidden>
      <section class="now" id="now" aria-labelledby="place">
        <div class="now-head">
          <div>
            <h1 id="place">City</h1>
            <p id="place-sub" class="now-sub"></p>
          </div>
          <div id="now-icon" class="now-icon" aria-hidden="true"></div>
        </div>
        <div class="now-main">
          <span id="now-temp" class="now-temp num">0°</span>
          <div>
            <p id="now-text" class="now-text">Clear</p>
            <p id="now-range" class="now-range num"></p>
          </div>
        </div>
        <dl class="facts">
          <div><dt>Feels like</dt><dd id="f-feels" class="num"></dd></div>
          <div><dt>Humidity</dt><dd id="f-hum" class="num"></dd></div>
          <div><dt>Wind</dt><dd id="f-wind" class="num"></dd></div>
          <div><dt>Rain chance</dt><dd id="f-rain" class="num"></dd></div>
        </dl>
      </section>

      <section class="card" aria-labelledby="h-hours">
        <h2 id="h-hours">Next 24 hours</h2>
        <ol id="hours" class="hours"></ol>
      </section>

      <section class="card" aria-labelledby="h-days">
        <h2 id="h-days">Next 7 days</h2>
        <ol id="days" class="days"></ol>
      </section>
    </div>
  </main>

  <footer class="foot wrap">
    <p>Built by <a href="https://zakyprojects.github.io/">Zakria Khan</a>. Weather data from <a href="https://open-meteo.com/">Open-Meteo</a>.</p>
    <p><a href="https://github.com/zakyprojects/weather">Source code</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
